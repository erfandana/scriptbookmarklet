<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auto Fill QC Inline</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="bg-slate-50 text-slate-800 flex h-screen overflow-hidden">
    <aside class="sidebar w-20 bg-indigo-800 flex flex-col justify-between items-center py-6 text-white shrink-0">
      <div class="flex flex-col items-center gap-8 w-full">
        <div class="sidebar-icon-wrapper p-2 hover:bg-indigo-700 rounded-lg cursor-pointer transition">
          <i data-lucide="store" class="w-7 h-7"></i>
        </div>
        <div class="sidebar-icon-wrapper p-2 hover:bg-indigo-700 rounded-lg cursor-pointer transition">
          <i data-lucide="badge-percent" class="w-6 h-6 opacity-80"></i>
        </div>
        <div class="sidebar-icon-wrapper p-2 hover:bg-indigo-700 rounded-lg cursor-pointer transition">
          <i data-lucide="pie-chart" class="w-6 h-6 opacity-80"></i>
        </div>
        <div class="p-3 bg-indigo-600/50 border border-indigo-400/30 rounded-xl shadow-md cursor-pointer w-12 h-12 flex items-center justify-center">
          <i data-lucide="settings" class="w-6 h-6"></i>
        </div>
      </div>
      <div class="sidebar-icon-wrapper p-2 hover:bg-indigo-700 rounded-lg cursor-pointer transition">
        <i data-lucide="log-out" class="w-6 h-6 opacity-80"></i>
      </div>
    </aside>

    <main class="flex-1 bg-white p-8 overflow-y-auto relative m-4 rounded-2xl shadow-sm border border-slate-100">
      <button class="absolute top-6 right-6 text-indigo-900 hover:bg-slate-100 p-1.5 rounded-lg transition border border-indigo-900/20">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>

      <h1 class="text-2xl font-bold text-indigo-950 mb-6 tracking-wide">Auto Fill QC Inline</h1>

      <div class="flex gap-12 text-sm font-medium text-slate-400 mb-0 pb-2">
        <button type="button" id="tab-semua" class="tab-btn text-indigo-800 border-b-2 border-indigo-800 pb-2 -mb-[10px] px-1 font-semibold">Semua</button>
        <button type="button" id="tab-makanan" class="tab-btn hover:text-indigo-800 pb-2">Makanan</button>
        <button type="button" id="tab-minuman" class="tab-btn hover:text-indigo-800 pb-2">Minuman</button>
        <button type="button" id="tab-snack" class="tab-btn hover:text-indigo-800 pb-2">Snack</button>
      </div>

      <form id="form-qc-utama" class="space-y-6 pt-4 border-t border-slate-300">
        <div class="grid grid-cols-1 md:grid-cols-12 gap-6 items-end">
          <div class="md:col-span-4 form-group">
            <label class="form-label">Nomer PO</label>
            <div class="flex gap-3 relative">
              <input type="text" id="input-scan-po" placeholder="Hasil Scan PO" class="form-input" />
              <button type="button" id="btn-scan-po" class="btn btn-scan shadow-indigo-200 shadow-md">Scan PO</button>
            </div>
          </div>

          <div class="md:col-span-4 form-group">
            <label class="form-label">Nomer Batch</label>
            <div class="flex gap-3 relative">
              <input type="text" id="input-scan-batch" placeholder="Hasil Scan Batch" class="form-input" />
              <button type="button" id="btn-scan-batch" class="btn btn-scan shadow-indigo-200 shadow-md">Scan Batch</button>
            </div>
          </div>

          <div class="md:col-span-4 form-group">
            <label class="form-label">Pilih Size</label>
            <select id="size-select" class="form-input appearance-none bg-no-repeat bg-right pr-8">
              <option value="">SELECT SIZE</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
          <div class="form-group">
            <label class="form-label">Density</label>
            <input type="number" step="0.001" id="input-density-1" placeholder="Input Density" class="form-input" />
          </div>
          <div class="form-group">
            <label class="form-label">Toleransi</label>
            <input type="text" id="input-toleransi" placeholder="Input Density" class="form-input" readonly />
          </div>
          <div class="form-group">
            <label class="form-label">Botol</label>
            <input type="text" id="input-botol" placeholder="Input Density" class="form-input" readonly />
          </div>
          <div class="form-group">
            <label class="form-label">Cap</label>
            <input type="text" id="input-cap" placeholder="Input Density" class="form-input" readonly />
          </div>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-5 gap-6">
          <div class="form-group">
            <label class="form-label">Label</label>
            <input type="text" id="input-label" placeholder="Input Density" class="form-input" readonly />
          </div>
          <div class="form-group">
            <label class="form-label">Folding</label>
            <input type="text" id="input-folding" placeholder="Input Density" class="form-input" readonly />
          </div>
          <div class="form-group">
            <label class="form-label">Layer</label>
            <input type="text" id="input-layer" placeholder="Input Density" class="form-input" readonly />
          </div>
          <div class="form-group">
            <label class="form-label">Carton</label>
            <input type="text" id="input-carton" placeholder="Input Density" class="form-input" readonly />
          </div>
          <div class="form-group">
            <label class="form-label">Note</label>
            <input type="text" id="input-note" placeholder="Input Note" class="form-input" readonly />
          </div>
        </div>

        <div class="pb-6 border-b border-slate-300">
          <h3 class="section-title">Berat Nett Pcs (Gram)</h3>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-6 max-w-3xl">
            <div class="form-group">
              <label class="form-label">Target</label>
              <input type="text" id="nett-target" placeholder="Input Density" class="form-input font-semibold" readonly />
            </div>
            <div class="form-group">
              <label class="form-label">Minimum</label>
              <input type="text" id="nett-min" placeholder="Input Density" class="form-input" readonly />
            </div>
            <div class="form-group">
              <label class="form-label">Maximum</label>
              <input type="text" id="nett-max" placeholder="Input Density" class="form-input" readonly />
            </div>
          </div>
        </div>

        <div class="pb-6 border-b border-slate-300">
          <h3 class="section-title">Berat Gross Pcs (Gram)</h3>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-6 max-w-3xl">
            <div class="form-group">
              <label class="form-label">Target</label>
              <input type="text" id="gross-target" placeholder="Input Density" class="form-input font-semibold" readonly />
            </div>
            <div class="form-group">
              <label class="form-label">Minimum</label>
              <input type="text" id="gross-min" placeholder="Input Density" class="form-input" readonly />
            </div>
            <div class="form-group">
              <label class="form-label">Maximum</label>
              <input type="text" id="gross-max" placeholder="Input Density" class="form-input" readonly />
            </div>
          </div>
        </div>

        <div class="pb-4">
          <h3 class="section-title">Berat Gross Carton (Kg)</h3>
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-6 max-w-4xl">
            <div class="form-group">
              <label class="form-label">Target</label>
              <input type="text" id="carton-target" placeholder="Input Density" class="form-input font-semibold" readonly />
            </div>
            <div class="form-group">
              <label class="form-label">Minimum</label>
              <input type="text" id="carton-min" placeholder="Input Density" class="form-input" readonly />
            </div>
            <div class="form-group">
              <label class="form-label">Maximum</label>
              <input type="text" id="carton-max" placeholder="Input Density" class="form-input" readonly />
            </div>
            <div class="form-group">
              <label class="form-label">Toleransi</label>
              <input type="text" id="carton-toleransi" placeholder="Input Density" class="form-input" readonly />
            </div>
          </div>
        </div>
      </form>

      <div id="form-qc-makanan" class="space-y-8 pt-6 border-t border-slate-300 hidden">
        <div>
          <h3 class="text-xl font-bold text-indigo-900 tracking-wide mb-1">Berat Botol dan Cap (Gram)</h3>
          <button type="button" class="px-6 py-2 bg-indigo-700 hover:bg-indigo-800 text-white text-sm font-medium rounded-lg shadow-sm mb-4 transition">Import</button>

          <div class="grid grid-cols-2 sm:grid-cols-5 gap-4">
            <script>
              for (let i = 1; i <= 10; i++) {
                document.write(`
                  <div class="flex flex-col gap-1">
                    <label class="text-sm font-bold text-indigo-700 underline">${i}</label>
                    <input type="number" step="0.01" placeholder="Input Density" class="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 placeholder:text-slate-300 transition shadow-sm" />
                  </div>
                `);
              }
            </script>
          </div>
        </div>

        <hr class="border-slate-200 my-6" />

        <div>
          <h3 class="text-xl font-bold text-indigo-900 tracking-wide mb-1">Berat Gross (Gram)</h3>
          <button type="button" class="px-6 py-2 bg-indigo-700 hover:bg-indigo-800 text-white text-sm font-medium rounded-lg shadow-sm mb-4 transition">Import</button>

          <div class="grid grid-cols-2 sm:grid-cols-5 gap-4">
            <script>
              for (let i = 1; i <= 10; i++) {
                document.write(`
                  <div class="flex flex-col gap-1">
                    <label class="text-sm font-bold text-indigo-700 underline">${i}</label>
                    <input type="number" step="0.01" placeholder="Input Density" class="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 placeholder:text-slate-300 transition shadow-sm" />
                  </div>
                `);
              }
            </script>
          </div>
        </div>
      </div>
    </main>

    <div id="scanner-modal" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-300">
      <div class="bg-white p-6 rounded-2xl max-w-md w-full mx-4 shadow-2xl relative">
        <h3 id="scanner-title" class="text-lg font-bold text-slate-900 mb-4 flex items-center gap-2">
          <i data-lucide="scan-line" class="text-indigo-600 w-5 h-5"></i>
          Scan Barcode
        </h3>
        <div id="scanner-reader" class="overflow-hidden rounded-xl bg-slate-100 border border-slate-200" style="width: 100%"></div>
        <button type="button" id="btn-close-scanner" class="mt-4 w-full py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-semibold rounded-xl transition">Batal / Tutup Kamera</button>
      </div>
    </div>

    <script>
      // Inisialisasi Ikon Lucide bawaan halaman
      lucide.createIcons();

      // DOM Elemen Tab & Form Container
      const tabSemua = document.getElementById("tab-semua");
      const tabMakanan = document.getElementById("tab-makanan");
      const tabMinuman = document.getElementById("tab-minuman");
      const tabSnack = document.getElementById("tab-snack");

      const formUtama = document.getElementById("form-qc-utama");
      const formMakanan = document.getElementById("form-qc-makanan");

      // Fungsi menormalkan kembali style tab ke semula (non-aktif)
      function bersihkanSemuaStyleTab() {
        const semuaTab = document.querySelectorAll(".tab-btn");
        semuaTab.forEach((btn) => {
          btn.className = "tab-btn hover:text-indigo-800 pb-2 text-slate-400";
        });
      }

      // Fungsi mengeset Tab menjadi Aktif secara visual
      function setTabAktif(elemenTab) {
        bersihkanSemuaStyleTab();
        elemenTab.className = "tab-btn text-indigo-800 border-b-2 border-indigo-800 pb-2 -mb-[10px] px-1 font-semibold";
      }

      // Trigger Event Click Tab MAKANAN
      tabMakanan.addEventListener("click", () => {
        setTabAktif(tabMakanan);
        formUtama.classList.add("hidden"); // Sembunyikan Form Utama (Semua)
        formMakanan.classList.remove("hidden"); // Munculkan Form Grid 10 Makanan
      });

      // Trigger Event Click Tab SEMUA
      tabSemua.addEventListener("click", () => {
        setTabAktif(tabSemua);
        formMakanan.classList.add("hidden"); // Sembunyikan Form Makanan
        formUtama.classList.remove("hidden"); // Munculkan kembali Form Utama
      });

      // (Opsional) Sisanya jika diklik set pasif saja biar interaktif
      tabMinuman.addEventListener("click", () => {
        setTabAktif(tabMinuman);
        formUtama.classList.add("hidden");
        formMakanan.classList.add("hidden");
      });
      tabSnack.addEventListener("click", () => {
        setTabAktif(tabSnack);
        formUtama.classList.add("hidden");
        formMakanan.classList.add("hidden");
      });
    </script>

    <script src="script.js"></script>
  </body>
</html>
